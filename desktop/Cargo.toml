# Its own workspace, with its own Cargo.lock and target/, so Tauri's dependency pins
# never change the versions the droplet server is built with.
[workspace]

[package]
name = "rust-radar-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
rust-radar = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

# Same as the server: decoding a 24.5M-cell GRIB2 grid is slow without optimisation.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
