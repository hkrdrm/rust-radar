# nginx site for rust-radar. deploy.sh install fills in __DOMAIN__ and saves it as
# /etc/nginx/sites-available/rust-radar; certbot --nginx then adds HTTPS to it.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location / {
        auth_basic "rust-radar";
        auth_basic_user_file /etc/nginx/rust-radar.htpasswd;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
